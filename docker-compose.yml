services:
  postgres:
    image: postgres:16-alpine
    container_name: monica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monica}
      POSTGRES_USER: ${POSTGRES_USER:-monica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monica_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monica} -d ${POSTGRES_DB:-monica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monica-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: monica-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_smb:/data

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monica-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-adminsdk.json
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_smb:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},vers=3.0,file_mode=0777,dir_mode=0777,iocharset=utf8,noperm,mfsymlinks,nobrl,cache=strict,actimeo=1"
      device: "${SMB_DEVICE}"
