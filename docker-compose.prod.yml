services:
  postgres:
    image: postgres:16-alpine
    container_name: monica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monica}
      POSTGRES_USER: ${POSTGRES_USER:-monica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monica_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monica} -d ${POSTGRES_DB:-monica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monica-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: monica-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      # Публичный доступ для presigned URL аватаров/файлов
      - "9010:9000"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monica-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-adminsdk.json
    volumes:
      - ./backend/secrets:/app/secrets:ro
      - django_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monica-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./backend/.env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-adminsdk.json
    volumes:
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend/monica
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${PUBLIC_URL:-http://159.194.232.74}
        REACT_APP_WS_URL: ${PUBLIC_WS_URL:-ws://159.194.232.74}
    container_name: monica-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: monica-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/django_static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  django_static:
